<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いま観られる映画｜大人＆こども</title>

<!-- iPhoneのホーム画面に追加したときアプリのように見せるための設定 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="映画ガイド">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#C8102E">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" href="icon-180.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F4;
    --bg-grad-a:#FFE6E2;
    --bg-grad-b:#E7E9FB;
    --card:#FFFFFF;
    --ink:#2E2A2E;
    --ink-soft:#665F66;
    --ink-faint:#948D94;
    --line:#EDE3E1;
    --accent:#C8102E;          /* シネマレッド：見出し・タブ */
    --accent-deep:#9E0B23;
    --accent-soft:#FDECEE;
    --kid:#1E9E63;             /* こども向け */
    --kid-soft:#E3F6EC;
    --adult:#4A4BC4;           /* 大人向け */
    --adult-soft:#E9EAFB;
    --gold:#B87400;            /* 入場者特典：最も目立たせる */
    --gold-bg:#FFF6D9;
    --gold-line:#F0C63C;
    --teal:#0E7C86;            /* ムビチケ */
    --teal-bg:#E4F5F6;
    --teal-line:#9FD8DC;
    --warn:#D93F2B;
    --warn-bg:#FFF0EC;
    --warn-line:#F5B9AC;
    --stale-bg:#FFF6DC;
    --stale-line:#EBC96A;
    --stale-ink:#8A6410;
    --radius:16px;
    --shadow:0 2px 4px rgba(70,50,60,.05), 0 8px 20px rgba(70,50,60,.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;
    color:var(--ink);
    background:var(--bg);
    background-image:linear-gradient(160deg,var(--bg-grad-a) 0%,var(--bg) 38%,var(--bg) 62%,var(--bg-grad-b) 100%);
    background-attachment:fixed;
    line-height:1.7;
    -webkit-text-size-adjust:100%;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 64px;}

  /* ---------- header ---------- */
  .site-head{text-align:center;padding:12px 0 18px;}
  .site-head h1{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
    font-size:clamp(21px,5.2vw,31px);margin:0 0 10px;letter-spacing:.02em;
  }
  .site-head h1 .em{color:var(--accent);}
  .period{
    display:inline-block;font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
    font-size:clamp(14px,3.4vw,18px);color:#fff;background:var(--accent);
    padding:6px 18px;border-radius:999px;box-shadow:var(--shadow);
  }
  .meta-line{margin-top:10px;font-size:13px;color:var(--ink-soft);}

  /* ---------- banners ---------- */
  .banner{
    border-radius:var(--radius);padding:12px 16px;margin:0 0 12px;
    font-size:14px;display:flex;gap:10px;align-items:flex-start;
  }
  .banner .ico{flex:0 0 auto;font-size:17px;line-height:1.4;}
  .banner-notice{background:#fff;border:1px solid var(--line);color:var(--ink-soft);box-shadow:var(--shadow);}
  .banner-stale{background:var(--stale-bg);border:1px solid var(--stale-line);color:var(--stale-ink);font-weight:500;}
  .banner-sample{background:var(--teal-bg);border:1px solid var(--teal-line);color:#0A5B63;font-weight:500;}

  /* ---------- criteria ---------- */
  .criteria{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);margin:0 0 16px;overflow:hidden;
  }
  .criteria > summary{
    list-style:none;cursor:pointer;padding:14px 18px;min-height:44px;
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:15px;
    display:flex;align-items:center;gap:8px;
    -webkit-tap-highlight-color:transparent;
  }
  .criteria > summary::-webkit-details-marker{display:none;}
  .criteria > summary::after{
    content:"\25BC";margin-left:auto;font-size:11px;color:var(--ink-faint);
    transition:transform .2s;
  }
  .criteria[open] > summary::after{transform:rotate(180deg);}
  .criteria-body{padding:0 18px 16px;border-top:1px dashed var(--line);}
  .criteria dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0;font-size:14px;}
  .criteria dt{color:var(--ink-faint);white-space:nowrap;font-weight:500;}
  .criteria dd{margin:0;}

  /* ---------- audience tabs ---------- */
  .tabs{
    display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
    margin:0 0 12px;
  }
  .tab{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:15px;
    cursor:pointer;border:2px solid var(--line);background:#fff;color:var(--ink-soft);
    border-radius:14px;padding:12px 6px;min-height:56px;line-height:1.35;
    transition:all .15s;-webkit-tap-highlight-color:transparent;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  }
  .tab .sub{font-family:inherit;font-size:11px;font-weight:500;opacity:.85;}
  .tab:hover{border-color:var(--accent);color:var(--accent-deep);}
  .tab[aria-pressed="true"]{color:#fff;}
  .tab.t-all[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);}
  .tab.t-adult[aria-pressed="true"]{background:var(--adult);border-color:var(--adult);box-shadow:0 2px 10px rgba(74,75,196,.3);}
  .tab.t-kids[aria-pressed="true"]{background:var(--kid);border-color:var(--kid);box-shadow:0 2px 10px rgba(30,158,99,.3);}

  /* ---------- filters ---------- */
  .filters{margin:0 0 8px;}
  .filter-group{
    display:flex;flex-wrap:nowrap;gap:8px;align-items:center;
    overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;padding:2px 2px 6px;margin:0 -2px 4px;
  }
  .filter-group::-webkit-scrollbar{display:none;}
  .filter-group .glabel{
    flex:0 0 auto;font-size:12px;color:var(--ink-faint);font-weight:500;margin-right:2px;
  }
  .fbtn{
    flex:0 0 auto;
    font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;
    border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);
    padding:7px 16px;border-radius:999px;transition:all .15s;line-height:1.4;
    min-height:44px;display:inline-flex;align-items:center;white-space:nowrap;
    -webkit-tap-highlight-color:transparent;
  }
  .fbtn:hover{border-color:var(--accent);color:var(--accent-deep);}
  .fbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(200,16,46,.3);}
  .fbtn.st[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);box-shadow:0 2px 8px rgba(14,124,134,.3);}
  .fbtn.all[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);box-shadow:none;}
  .result-count{font-size:13px;color:var(--ink-soft);margin:6px 2px 14px;}
  .result-count b{color:var(--accent);font-size:15px;}

  /* ---------- cards ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:16px;align-items:start;}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;display:flex;gap:14px;align-items:flex-start;
  }
  .card.check{border:2px solid var(--warn-line);background:var(--warn-bg);}

  /* poster */
  .poster{
    flex:0 0 150px;width:150px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;
    background:#EFE9EE;position:sticky;top:14px;
  }
  .poster img{width:100%;height:100%;object-fit:cover;display:block;background:#EFE9EE;}
  .poster.ph{
    display:flex;align-items:center;justify-content:center;text-align:center;
    padding:10px;color:#fff;
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:14px;line-height:1.45;
  }

  .body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:9px;}
  .card h2{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;
    font-size:18px;margin:0;line-height:1.45;word-break:break-word;
  }
  .release{font-size:14px;font-weight:700;color:var(--accent);margin:0;}
  .release .st{font-weight:500;color:var(--ink-faint);font-size:12.5px;margin-left:6px;}

  .badges{display:flex;flex-wrap:wrap;gap:6px;}
  .badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;line-height:1.6;}
  .b-adult{background:var(--adult-soft);color:#31329B;}
  .b-kid{background:var(--kid-soft);color:#0F7148;}
  .b-rating{background:#F1EDE6;color:var(--ink-soft);}
  .b-genre{background:#F4ECF3;color:#7A5A78;}
  .b-dub{background:#FFF0E2;color:#A45514;}

  .synopsis{font-size:13.5px;color:var(--ink-soft);margin:0;}

  /* ムビチケ */
  .ticket{
    background:var(--teal-bg);border:1.5px solid var(--teal-line);border-radius:12px;
    padding:10px 13px;font-size:13.5px;color:#0A5B63;
  }
  .ticket .head{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:13px;
    color:var(--teal);display:block;margin-bottom:2px;
  }
  .ticket .term{font-weight:700;font-size:15px;color:#07484F;display:block;}
  .ticket .sub{font-size:12.5px;opacity:.9;display:block;}
  .ticket.none{background:#F6F4F4;border-color:var(--line);color:var(--ink-faint);}
  .ticket.none .head{color:var(--ink-faint);}

  /* 入場者特典：ページ内でいちばん目立たせる */
  .bonus{
    background:var(--gold-bg);border:2px solid var(--gold-line);border-radius:12px;
    padding:11px 13px;color:#6B4300;
    box-shadow:0 2px 8px rgba(240,198,60,.28);
  }
  .bonus .head{
    font-family:"Zen Maru Gothic",sans-serif;font-weight:700;font-size:14px;
    color:var(--gold);display:block;margin-bottom:5px;letter-spacing:.02em;
  }
  .bonus ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;}
  .bonus li{font-size:13px;line-height:1.6;}
  .bonus .phase{
    display:inline-block;background:var(--gold);color:#fff;font-weight:700;
    font-size:11.5px;padding:1px 8px;border-radius:999px;margin-right:6px;
  }
  .bonus .content{font-weight:700;font-size:15px;color:#4A2E00;display:block;margin-top:2px;}
  .bonus .when{font-size:12.5px;color:#8A6410;}
  .bonus .lim{
    display:inline-block;background:#fff;border:1px solid var(--gold-line);
    color:var(--gold);font-weight:700;font-size:11px;padding:0 7px;border-radius:999px;margin-left:6px;
  }
  .bonus .note{font-size:12px;color:#8A6410;display:block;}

  .rows{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:13.5px;margin:0;}
  .rows dt{color:var(--ink-faint);white-space:nowrap;font-weight:500;}
  .rows dd{margin:0;}

  .checkbox{
    background:#fff;border:1.5px solid var(--warn-line);border-radius:11px;
    padding:10px 12px;font-size:13px;color:var(--warn);font-weight:500;margin:0;
  }
  .checkbox b{font-family:"Zen Maru Gothic",sans-serif;}

  .go{margin-top:auto;padding-top:4px;display:flex;flex-wrap:wrap;gap:8px;}
  .go a{
    display:inline-flex;align-items:center;min-height:44px;
    font-size:13.5px;font-weight:700;text-decoration:none;
    color:var(--accent-deep);border:1.5px solid var(--accent);border-radius:999px;
    padding:6px 16px;transition:all .15s;-webkit-tap-highlight-color:transparent;
  }
  .go a:hover{background:var(--accent);color:#fff;}
  .go a.tk{color:var(--teal);border-color:var(--teal);}
  .go a.tk:hover{background:var(--teal);color:#fff;}

  .empty,.error{
    background:#fff;border:1px dashed var(--line);border-radius:var(--radius);
    padding:32px 20px;text-align:center;color:var(--ink-soft);font-size:14px;
  }
  .error{border:1.5px solid var(--warn-line);color:var(--warn);text-align:left;}
  .error p{margin:0 0 8px;}
  .error code{
    display:block;background:#2E2A24;color:#FFD9B3;padding:10px 12px;border-radius:8px;
    font-size:12.5px;margin:10px 0 0;overflow-x:auto;white-space:pre;
  }
  footer{text-align:center;font-size:12px;color:var(--ink-faint);margin-top:40px;line-height:1.9;}

  @media (max-width:640px){
    .wrap{padding:14px 12px 48px;}
    .grid{grid-template-columns:1fr;gap:14px;}
    .card{padding:14px;gap:11px;}
    .poster{flex-basis:104px;width:104px;position:static;}
    .poster.ph{font-size:12px;}
    .card h2{font-size:16.5px;}
    .criteria dl{grid-template-columns:1fr;gap:2px;}
    .criteria dt{margin-top:8px;}
    .tab{font-size:13.5px;padding:10px 4px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="site-head">
    <h1>🎬 いま観られる<span class="em">映画</span></h1>
    <div id="period" class="period">読み込み中…</div>
    <div id="metaLine" class="meta-line"></div>
  </header>

  <div id="banners"></div>

  <div class="banner banner-notice">
    <span class="ico">⚠️</span>
    <span>入場者特典は<b>数量限定・なくなり次第終了</b>です。ムビチケの販売期間や特典の配布状況は変わることがあるため、<b>おでかけ前に必ず公式サイトで最新情報を確認</b>してください。</span>
  </div>

  <details class="criteria" id="criteriaBox">
    <summary>🔍 掲載の条件</summary>
    <div class="criteria-body"><dl id="criteriaList"></dl></div>
  </details>

  <div class="tabs" id="tabs" hidden>
    <button class="tab t-all"   data-aud="all"   aria-pressed="true">すべて</button>
    <button class="tab t-adult" data-aud="adult" aria-pressed="false">🎬 大人向け</button>
    <button class="tab t-kids"  data-aud="kids"  aria-pressed="false">🧒 こども向け<span class="sub">小学生以下</span></button>
  </div>

  <div class="filters" id="filters" hidden>
    <div class="filter-group">
      <span class="glabel">公開</span>
      <button class="fbtn all" data-kind="status" data-key=""     aria-pressed="true">すべて</button>
      <button class="fbtn st"  data-kind="status" data-key="now"  aria-pressed="false">公開中</button>
      <button class="fbtn st"  data-kind="status" data-key="soon" aria-pressed="false">近日公開</button>
    </div>
    <div class="filter-group">
      <span class="glabel">条件</span>
      <button class="fbtn" data-kind="flag" data-key="_hasMubichike" aria-pressed="false">🎫 ムビチケ販売中</button>
      <button class="fbtn" data-kind="flag" data-key="_hasBonus"     aria-pressed="false">🎁 入場者特典あり</button>
      <button class="fbtn" data-kind="flag" data-key="dubbed"        aria-pressed="false">日本語吹替あり</button>
    </div>
  </div>

  <div id="count" class="result-count"></div>
  <main id="list" class="grid"></main>

  <footer>
    <div>大人＆こども（小学生以下）向けの上映作品まとめ ／ 横浜周辺で観られるかの目安つき</div>
    <div id="credit"></div>
  </footer>
</div>

<script>
(function () {
  "use strict";

  var STALE_DAYS = 18;   // 隔週更新なので、18日を過ぎたら「古いかも」と警告する
  // status は「すべて("") / 公開中("now") / 近日公開("soon")」から1つだけ選ぶ。
  // flags は複数選べて、選んだものを「すべて満たす」で絞り込む。
  var state = { aud: "all", status: "", flags: [] };
  var data = null;

  // ポスター画像が無いときの背景色（タイトルの文字数から決めるので毎回同じ色になる）
  var PH_COLORS = ["#7A5AA8", "#3F7FA6", "#2F8F6B", "#B5763A", "#A8486A", "#4A5A9E", "#8A6D3B", "#5C6E8A"];

  function $(id) { return document.getElementById(id); }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text != null) { n.textContent = text; }
    return n;
  }

  /* ---------- load ----------
     読み込みは2段構え。
       1) movies.json を fetch する（サーバー経由・GitHub Pages経由で開いたとき）
       2) 失敗したら movies.js を <script> で読む
          （index.html をダブルクリック＝file:// で開いたとき。
            ブラウザの制限で fetch は使えないが <script> なら読める）
     movies.js は movies.json と同じ内容で、update.bat が自動生成します。
  ------------------------------------------------------------------ */
  function loadSource(jsonFile, jsFile, varName) {
    return fetch(jsonFile + "?_=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) { throw new Error("HTTP " + r.status); }
        return r.json();
      })
      .catch(function () {
        return new Promise(function (resolve, reject) {
          var s = document.createElement("script");
          s.src = jsFile + "?_=" + Date.now();
          s.onload = function () {
            if (window[varName]) { resolve(window[varName]); }
            else { reject(new Error(jsFile + " の中身が読み取れませんでした")); }
          };
          s.onerror = function () { reject(new Error(jsonFile + " / " + jsFile + " のどちらも読み込めませんでした")); };
          document.head.appendChild(s);
        });
      });
  }

  loadSource("movies.json", "movies.js", "__MOVIES__")
    .then(function (json) {
      data = json;
      if (!Array.isArray(data.movies)) { data.movies = []; }
      data.movies.forEach(decorate);
      render();
    })
    .catch(showLoadError);

  // 絞り込みで使う派生フラグをあらかじめ計算しておく。
  // 上映劇場での絞り込みは行わない（横浜周辺で観られない作品はほぼ無く、
  // 劇場情報が空なのは「観られない」ではなく「調べきれなかった」を意味するため）。
  function decorate(m) {
    var mv = m.mubichike || {};
    m._hasMubichike = mv.available === true;
    m._hasBonus = Array.isArray(m.bonuses) && m.bonuses.length > 0;
  }

  function showLoadError(reason) {
    var box = el("div", "error");
    box.appendChild(el("p", null, "映画データを読み込めませんでした。"));
    box.appendChild(el("p", null,
      "index.html と同じフォルダに movies.json と movies.js があるか確認してください。" +
      "movies.js が無い場合は update.bat を1回実行すると作られます。"));
    box.appendChild(el("code", null, String(reason && reason.message ? reason.message : reason)));
    $("list").appendChild(box);
    $("period").textContent = "読み込みエラー";
  }

  /* ---------- render ---------- */
  function render() {
    $("period").textContent = data.targetPeriod || "対象期間 未設定";

    var n = (data.movies || []).length;
    var meta = "最終更新：" + (data.updatedAt || "不明") + "　／　掲載 " + n + " 本";
    if (data.nextUpdate) { meta += "　／　次回更新：" + data.nextUpdate + " ごろ"; }
    $("metaLine").textContent = meta;

    if (data.posterCredit) { $("credit").textContent = data.posterCredit; }

    renderBanners();
    renderCriteria();
    $("tabs").hidden = false;
    $("filters").hidden = false;
    bindTabs();
    bindFilters();
    apply();
  }

  function renderBanners() {
    var box = $("banners");
    box.innerHTML = "";

    var days = daysSince(data.updatedAt);
    if (days === null || days >= STALE_DAYS) {
      var msg = days === null
        ? "最終更新日を読み取れませんでした。情報が古い可能性があります。update.bat を実行してデータを更新してください。"
        : "情報が古い可能性があります（最終更新から " + days + " 日経過）。update.bat を実行してデータを更新してください。";
      var b = el("div", "banner banner-stale");
      b.appendChild(el("span", "ico", "🕒"));
      b.appendChild(el("span", null, msg));
      box.appendChild(b);
    }

    if (data.isSampleData) {
      var s = el("div", "banner banner-sample");
      s.appendChild(el("span", "ico", "🧪"));
      s.appendChild(el("span", null,
        "これは動作確認用のサンプルデータです。実際の上映情報ではありません。update.bat を実行すると本物の映画情報に置き換わります。"));
      box.appendChild(s);
    }
  }

  function daysSince(iso) {
    if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) { return null; }
    var p = iso.split("-");
    var then = new Date(+p[0], +p[1] - 1, +p[2]);
    if (isNaN(then.getTime())) { return null; }
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.floor((today - then) / 86400000);
  }

  var CRITERIA_LABELS = {
    audience: "対象",
    area: "上映エリアの目安",
    period: "掲載する時期",
    count: "掲載本数",
    focus: "重点的に載せる情報",
    updateCycle: "更新のサイクル"
  };

  function renderCriteria() {
    var dl = $("criteriaList");
    dl.innerHTML = "";
    var c = data.criteria || {};
    var keys = Object.keys(CRITERIA_LABELS).filter(function (k) { return c[k]; });
    Object.keys(c).forEach(function (k) { if (keys.indexOf(k) === -1) { keys.push(k); } });
    if (!keys.length) { $("criteriaBox").hidden = true; return; }
    keys.forEach(function (k) {
      dl.appendChild(el("dt", null, CRITERIA_LABELS[k] || k));
      dl.appendChild(el("dd", null, String(c[k])));
    });
  }

  /* ---------- tabs / filters ---------- */
  function bindTabs() {
    var tabs = $("tabs").querySelectorAll(".tab");
    Array.prototype.forEach.call(tabs, function (t) {
      t.addEventListener("click", function () {
        state.aud = t.getAttribute("data-aud");
        Array.prototype.forEach.call(tabs, function (x) {
          x.setAttribute("aria-pressed", x === t ? "true" : "false");
        });
        apply();
      });
    });
  }

  function bindFilters() {
    var btns = $("filters").querySelectorAll(".fbtn");
    Array.prototype.forEach.call(btns, function (btn) {
      btn.addEventListener("click", function () {
        var kind = btn.getAttribute("data-kind");
        var key = btn.getAttribute("data-key");
        if (kind === "status") {
          // 公開状況はラジオボタンと同じ動き。押したものだけが選ばれる
          state.status = key;
        } else {
          var i = state.flags.indexOf(key);
          if (i === -1) { state.flags.push(key); } else { state.flags.splice(i, 1); }
        }
        syncButtons(btns);
        apply();
      });
    });
    syncButtons(btns);
  }

  function syncButtons(btns) {
    Array.prototype.forEach.call(btns, function (btn) {
      var kind = btn.getAttribute("data-kind");
      var key = btn.getAttribute("data-key");
      var on = (kind === "status")
        ? (state.status === key)
        : (state.flags.indexOf(key) !== -1);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    });
  }

  // 対象（大人/こども）は「both」を両方に出す。
  // 公開状況は1つだけ選ばれている（空なら絞り込まない）。条件どうしは AND。
  function match(m) {
    if (state.aud !== "all") {
      var aud = m.audience || "both";
      if (aud !== "both" && aud !== state.aud) { return false; }
    }
    if (state.status && m.status !== state.status) { return false; }
    for (var i = 0; i < state.flags.length; i++) {
      if (m[state.flags[i]] !== true) { return false; }
    }
    return true;
  }

  function apply() {
    var all = data.movies || [];
    var shown = all.filter(match);
    var list = $("list");
    list.innerHTML = "";

    var count = $("count");
    count.innerHTML = "";
    var strong = el("b", null, String(shown.length));
    if (shown.length === all.length) {
      count.appendChild(document.createTextNode("全 "));
      count.appendChild(strong);
      count.appendChild(document.createTextNode(" 本"));
    } else {
      count.appendChild(strong);
      count.appendChild(document.createTextNode(" 本 / 全 " + all.length + " 本"));
    }

    if (!shown.length) {
      list.appendChild(el("div", "empty", all.length
        ? "条件に合う作品がありません。公開は「すべて」を押し、条件のボタンはもう一度押すと解除できます。"
        : "今回は掲載できる作品がありませんでした。"));
      return;
    }
    shown.forEach(function (m) { list.appendChild(card(m)); });
  }

  /* ---------- card ---------- */
  function placeholder(m) {
    var t = m.title || "";
    var box = el("div", "poster ph", t);
    box.style.background = PH_COLORS[t.length % PH_COLORS.length];
    return box;
  }

  function poster(m) {
    if (!m.posterUrl) { return placeholder(m); }
    var box = el("div", "poster");
    var img = document.createElement("img");
    img.src = m.posterUrl;
    img.alt = (m.title || "") + " のポスター";
    img.loading = "lazy";
    img.referrerPolicy = "no-referrer";
    // 画像が読めなかったときは、色付きのタイトル表示に差し替える
    img.onerror = function () {
      if (box.parentNode) { box.parentNode.replaceChild(placeholder(m), box); }
    };
    box.appendChild(img);
    return box;
  }

  function card(m) {
    var c = el("article", "card" + (m.needsCheck ? " check" : ""));
    c.appendChild(poster(m));

    var b = el("div", "body");

    b.appendChild(el("h2", null, m.title || "(タイトルなし)"));

    if (m.releaseLabel) {
      var rel = el("p", "release", m.releaseLabel);
      if (m.status === "now") { rel.appendChild(el("span", "st", "公開中")); }
      else if (m.status === "soon") { rel.appendChild(el("span", "st", "近日公開")); }
      b.appendChild(rel);
    }

    var badges = el("div", "badges");
    function badge(cls, text) { badges.appendChild(el("span", "badge " + cls, text)); }
    var aud = m.audience || "both";
    if (aud === "kids" || aud === "both") { badge("b-kid", "🧒 こども向け"); }
    if (aud === "adult" || aud === "both") { badge("b-adult", "🎬 大人向け"); }
    if (m.rating) { badge("b-rating", m.rating); }
    if (m.runtime) { badge("b-rating", m.runtime + "分"); }
    if (m.genre) { badge("b-genre", m.genre); }
    if (m.dubbed) { badge("b-dub", "日本語吹替あり"); }
    if (badges.children.length) { b.appendChild(badges); }

    if (m.needsCheck) {
      var w = el("p", "checkbox");
      w.appendChild(el("b", null, "⚠️ 要確認"));
      w.appendChild(document.createElement("br"));
      w.appendChild(document.createTextNode(
        m.checkReason || "情報源によって内容が食い違っています。公式サイトで確認してください。"));
      b.appendChild(w);
    }

    if (m.synopsis) { b.appendChild(el("p", "synopsis", m.synopsis)); }

    b.appendChild(bonusBlock(m));
    b.appendChild(ticketBlock(m));

    var rows = el("dl", "rows");
    function row(label, value) {
      if (!value) { return; }
      rows.appendChild(el("dt", null, label));
      rows.appendChild(el("dd", null, value));
    }
    if (Array.isArray(m.theaters) && m.theaters.length) {
      row("横浜周辺", m.theaters.join(" / "));
    }
    if (m.note) { row("メモ", m.note); }
    if (rows.children.length) { b.appendChild(rows); }

    var go = el("div", "go");
    function link(cls, text, href) {
      if (!href) { return; }
      var a = el("a", cls, text);
      a.href = href;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      go.appendChild(a);
    }
    link(null, "公式サイト →", m.officialUrl);
    link("tk", "ムビチケ購入 →", (m.mubichike || {}).url);
    if (go.children.length) { b.appendChild(go); }

    c.appendChild(b);
    return c;
  }

  // 入場者特典：カードの中でいちばん目立つブロック
  function bonusBlock(m) {
    var list = Array.isArray(m.bonuses) ? m.bonuses : [];

    if (!list.length) {
      var none = el("div", "ticket none");
      none.appendChild(el("span", "head", "🎁 入場者特典"));
      none.appendChild(document.createTextNode(m.bonusNote || "現時点では確認できていません"));
      return none;
    }

    var box = el("div", "bonus");
    box.appendChild(el("span", "head", "🎁 入場者特典"));
    var ul = document.createElement("ul");
    list.forEach(function (bn) {
      var li = document.createElement("li");
      if (bn.phase) { li.appendChild(el("span", "phase", bn.phase)); }
      if (bn.period) { li.appendChild(el("span", "when", bn.period)); }
      li.appendChild(el("span", "content", bn.content || "内容未発表"));
      if (bn.limited) { li.appendChild(el("span", "lim", "数量限定")); }
      if (bn.note) { li.appendChild(el("span", "note", bn.note)); }
      ul.appendChild(li);
    });
    box.appendChild(ul);
    return box;
  }

  // ムビチケ前売券
  function ticketBlock(m) {
    var mv = m.mubichike || {};

    if (!mv.available) {
      var none = el("div", "ticket none");
      none.appendChild(el("span", "head", "🎫 ムビチケ前売券"));
      none.appendChild(document.createTextNode(mv.note || "販売なし／情報未確認"));
      return none;
    }

    var box = el("div", "ticket");
    box.appendChild(el("span", "head", "🎫 ムビチケ前売券"));
    box.appendChild(el("span", "term", mv.salesLabel || "販売期間 未確認"));
    var sub = [];
    if (mv.types) { sub.push(mv.types); }
    if (mv.price) { sub.push(mv.price); }
    if (sub.length) { box.appendChild(el("span", "sub", sub.join("　・　"))); }
    if (mv.note) { box.appendChild(el("span", "sub", mv.note)); }
    return box;
  }
})();
</script>
</body>
</html>
